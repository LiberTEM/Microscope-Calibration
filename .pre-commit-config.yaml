# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
# pre-commit.ci has no environment with the dependencies that pyright needs,
# the CI job "typecheck" runs the hook instead
ci:
  skip: [pyright]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-added-large-files
    exclude: prototypes/clcalib.ipynb
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff-check
    args: [--fix]
  - id: ruff-format
- repo: https://github.com/asottile/pyupgrade
  rev: v3.22.0
  hooks:
    - id: pyupgrade
      args: ["--py314-plus"]
# Uses pyright from the active environment, which has the dependencies of the
# package installed, see CLAUDE.md
- repo: local
  hooks:
    - id: pyright
      name: pyright
      entry: pyright
      language: system
      types: [python]
      pass_filenames: false
