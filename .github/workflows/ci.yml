name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]*'
    tags:
      - 'v[0-9]*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.14", ]
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Choose Python version ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python_version }}'
      - name: install the package
        run: python3 -m pip install uv && uv pip install --system .[test,common,diffraction]
      - name: run pytest
        run: pytest --cov=microscope_calibration --cov-report=xml --cov-report=term tests/
      - name: submit code coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  pinned-requirements:
    if: false  # skip job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Choose Python version ${{ matrix.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install the package
        run: python3 -m pip install uv && uv pip install --system .[test,common,diffraction] -r packaging/requirements.txt
      - name: run pytest
        run: pytest --cov=microscope_calibration --cov-report=xml --cov-report=term tests/

  numba_coverage:
    if: false  # skip job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 'Choose Python version 3.14'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: install the package
        run: python3 -m pip install uv && uv pip install --system .[test,common,diffraction]
      - name: run pytest
        run: NUMBA_DISABLE_JIT=1 pytest --cov=microscope_calibration --cov-report=xml --cov-report=term tests/
      - name: submit code coverage
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
